<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivio | Create Tracking Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex flex-col items-center">
  <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl my-6">
    <h1 class="text-2xl font-bold text-center text-indigo-400 mb-6">Generate Tracking Code</h1>
    
    <form id="shipmentForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Sender Name</label>
        <input type="text" id="sender" required placeholder="e.g. Hershey Hal Scott" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Receiver Name</label>
        <input type="text" id="receiver" required placeholder="e.g. John Doe" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Description / Items</label>
        <input type="text" id="description" required placeholder="e.g. Consignment Box" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Current Location</label>
        <input type="text" id="location" required placeholder="e.g. Central Hub, London" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Delivery Destination Address</label>
        <input type="text" id="destination" required placeholder="e.g. 45 Providence Estate" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Status</label>
          <select id="status" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            <option value="Pending">Pending</option>
            <option value="In Transit">In Transit</option>
            <option value="Out for Delivery">Out for Delivery</option>
            <option value="Delivered">Delivered</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Estimated Delivery</label>
          <input type="date" id="eta" required class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
        </div>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-bold transition mt-4">
        Generate Tracking Code
      </button>
    </form>

    <div id="output" class="hidden mt-6 p-4 bg-slate-800 border border-indigo-500/50 rounded-lg text-center">
      <p class="text-xs text-slate-400 mb-1">Generated Tracking Code:</p>
      <p id="codeDisplay" class="text-xl font-mono font-bold text-green-400 select-all"></p>
      <p class="text-xs text-slate-400 mt-2">Send this code to your client to track their order.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://chxfqlopvpijcqhfnpsb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TlNgn8wJ6UfQoH24r_wc6A_VQHMb56K";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('shipmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const randomNum = Math.floor(1000 + Math.random() * 9000);
      const randomLetters = Math.random().toString(36).substring(2, 4).toUpperCase();
      const trackingCode = `DLV-${randomNum}-${randomLetters}`;

      const { data, error } = await db.from('shipments').insert([
        {
          id: trackingCode,
          sender_name: document.getElementById('sender').value,
          receiver_name: document.getElementById('receiver').value,
          description: document.getElementById('description').value,
          current_location: document.getElementById('location').value,
          destination: document.getElementById('destination').value,
          status: document.getElementById('status').value,
          eta: document.getElementById('eta').value
        }
      ]);

      if (error) {
        alert("Error saving shipment: " + error.message);
      } else {
        document.getElementById('codeDisplay').innerText = trackingCode;
        document.getElementById('output').classList.remove('hidden');
        document.getElementById('shipmentForm').reset();
      }
    });
  </script>
</body>
</html>
