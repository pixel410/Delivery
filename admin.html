<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Shipment Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }
    .card { max-width: 500px; margin: 0 auto 24px; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    h2 { font-size: 18px; margin-bottom: 16px; color: #38bdf8; }
    h3 { font-size: 14px; margin: 16px 0 8px; color: #f43f5e; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin: 8px 0 4px; text-transform: uppercase; font-weight: 600; }
    input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; outline: none; }
    input[type="date"] { color-scheme: dark; }
    button { width: 100%; margin-top: 16px; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .update-btn { background: #059669; }
    .update-btn:hover { background: #047857; }
    .msg { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; display: none; }
    .success { background: #064e3b; color: #34d399; }
    .error { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Create New Shipment</h2>

    <h3>Sender Details</h3>
    <label>Sender Name</label>
    <input type="text" id="sender_name">
    <label>Sender Address</label>
    <input type="text" id="sender_address">
    <label>Sender Email</label>
    <input type="email" id="sender_email">
    <label>Sender Phone</label>
    <input type="text" id="sender_phone">

    <h3>Receiver Details</h3>
    <label>Receiver Name</label>
    <input type="text" id="receiver_name">
    <label>Receiver Address</label>
    <input type="text" id="receiver_address">
    <label>Receiver Email</label>
    <input type="email" id="receiver_email">
    <label>Receiver Phone</label>
    <input type="text" id="receiver_phone">

    <h3>Shipment Details</h3>
    <label>Origin</label>
    <input type="text" id="origin" placeholder="e.g. Canada">
    <label>Destination</label>
    <input type="text" id="destination" placeholder="e.g. Ohio">
    <label>Current Location</label>
    <input type="text" id="current_location" placeholder="e.g. FedEx Hub, Memphis, TN">
    <label>Status</label>
    <select id="status">
      <option value="In Transit">In Transit</option>
      <option value="Out for Delivery">Out for Delivery</option>
      <option value="Delivered">Delivered</option>
      <option value="Exception">Exception</option>
    </select>
    <label>Estimated Arrival Date</label>
    <input type="date" id="estimated_arrival">

    <button onclick="createShipment()">Generate Tracking Code</button>
    <div id="createMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Update Existing Package Location</h2>
    <label>Tracking Code</label>
    <input type="text" id="updateCode" placeholder="e.g. DLV-2780-9T">
    <label>New Current Location</label>
    <input type="text" id="updateLocation" placeholder="e.g. London Transit Hub">
    <label>New Status</label>
    <select id="updateStatus">
      <option value="In Transit">In Transit</option>
      <option value="Out for Delivery">Out for Delivery</option>
      <option value="Delivered">Delivered</option>
      <option value="Exception">Exception</option>
    </select>
    <button class="update-btn" onclick="updateShipment()">Update Location</button>
    <div id="updateMsg" class="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://chxfqlopvpijcqhfnpsb.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_TlNgn8wJ6UfQoH24r_wc6A_VQHMb56K";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function generateCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "DLV-";
      for(let i=0; i<4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      code += "-";
      for(let i=0; i<2; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    function formatSelectedDate(dateString) {
      if (!dateString) return 'Pending';
      const [year, month, day] = dateString.split('-');
      const dateObj = new Date(year, month - 1, day);
      return dateObj.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'numeric',
        day: 'numeric',
        year: 'numeric'
      });
    }

    async function createShipment() {
      const msg = document.getElementById('createMsg');
      const tracking_code = generateCode();
      const rawDate = document.getElementById('estimated_arrival').value;
      const formattedArrival = formatSelectedDate(rawDate);
      
      const { data, error } = await db.from('shipments').insert([{
        tracking_code,
        sender_name: document.getElementById('sender_name').value,
        sender_address: document.getElementById('sender_address').value,
        sender_email: document.getElementById('sender_email').value,
        sender_phone: document.getElementById('sender_phone').value,
        receiver_name: document.getElementById('receiver_name').value,
        receiver_address: document.getElementById('receiver_address').value,
        receiver_email: document.getElementById('receiver_email').value,
        receiver_phone: document.getElementById('receiver_phone').value,
        origin: document.getElementById('origin').value || 'Origin Hub',
        destination: document.getElementById('destination').value || 'Destination Hub',
        current_location: document.getElementById('current_location').value || 'FedEx Hub',
        status: document.getElementById('status').value,
        estimated_arrival: formattedArrival
      }]);

      if(error) {
        msg.className = "msg error";
        msg.innerText = "Error: " + error.message;
      } else {
        msg.className = "msg success";
        msg.innerText = "Generated Code: " + tracking_code;
      }
      msg.style.display = "block";
    }

    async function updateShipment() {
      const msg = document.getElementById('updateMsg');
      const code = document.getElementById('updateCode').value.trim();
      const newLoc = document.getElementById('updateLocation').value.trim();
      const newStatus = document.getElementById('updateStatus').value;

      if(!code || !newLoc) {
        msg.className = "msg error";
        msg.innerText = "Please enter tracking code and new location.";
        msg.style.display = "block";
        return;
      }

      const { data, error } = await db
        .from('shipments')
        .update({ current_location: newLoc, status: newStatus })
        .ilike('tracking_code', code);

      if(error) {
        msg.className = "msg error";
        msg.innerText = "Error updating: " + error.message;
      } else {
        msg.className = "msg success";
        msg.innerText = "Updated location for " + code;
      }
      msg.style.display = "block";
    }
  </script>
</body>
</html>
